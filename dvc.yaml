stages:
  prepare:
    cmd: python -m spc_module.dataset
    deps:
      - data/raw/salary.csv
      - spc_module/dataset.py
      - spc_module/preprocessing/cleaning.py
    outs:
      - data/interim/salary_clean.csv

  featurize:
    cmd: python -m spc_module.features
    deps:
      - data/interim/salary_clean.csv
      - spc_module/features.py
      - spc_module/preprocessing/builder.py
      - spc_module/preprocessing/encoding.py
      - spc_module/preprocessing/splitting.py
    params:
      - features.test_size
      - features.random_state
      - features.drop_first
    outs:
      - data/processed/features.csv
      - data/processed/labels.csv
      - data/processed/test_features.csv
      - data/processed/test_labels.csv

  train:
    cmd: python -m spc_module.modeling.train
    deps:
      - data/processed/features.csv
      - data/processed/labels.csv
      - data/processed/test_features.csv
      - data/processed/test_labels.csv
      - spc_module/modeling/train.py
      - spc_module/modeling/models.py
      - spc_module/modeling/evaluator.py
    params:
      - train.models
      - train.xgboost.n_estimators
      - train.xgboost.max_depth
      - train.xgboost.learning_rate
      - train.mlp.dropout_rate
      - train.mlp.learning_rate_init
    outs:
      - models/model.pkl
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/plots.csv:
          cache: false
          template: confusion
          x: actual
          y: predicted
