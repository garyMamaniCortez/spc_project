[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "spc_module"
version = "0.0.1"
description = "Salary Prediction Clasification project"
authors = [
  { name = "Gary Mamani" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["spc_module"]
include = ["pyproject.toml", "spc_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["spc_module"]
force-sort-within-sections = true

